<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./common.css">
  </head>
  <body>
    <canvas id="mesh"></canvas>
    <main class="stage">
      <div class="brand floating"><div class="mark"></div><span>Tab Council</span></div>
      <h1 class="headline floating float2">Your AI tabs, one deliberating council.</h1>
      <p class="subhead floating float3">Name a Chrome tab group <strong>tab-council</strong>. The extension turns the grouped AI pages into members, judges, and validators.</p>
      <section class="chrome floating float3">
        <div class="browserTop"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="addr"></div></div>
        <div class="groupLabel">tab-council</div>
        <div class="tabs">
          <div class="tab">ChatGPT <span>member</span></div>
          <div class="tab">Claude <span>judge</span></div>
          <div class="tab">Gemini <span>member</span></div>
          <div class="tab">Perplexity <span>validator</span></div>
          <div class="tab">Grok <span>member</span></div>
        </div>
      </section>
    </main>
    <script src="./common.js"></script>
  </body>
</html>
